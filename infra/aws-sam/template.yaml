AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Aussie EcoLens AWS serverless backend.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64
    Environment:
      Variables:
        POWERTOOLS_SERVICE_NAME: aussie-ecolens

Parameters:
  AppName:
    Type: String
    Default: aussie-ecolens
    AllowedPattern: "^[a-z0-9-]+$"
    ConstraintDescription: Use lowercase letters, numbers, and hyphens only.
  CognitoUserPoolName:
    Type: String
    Default: aussie-ecolens-users
  CognitoCallbackUrl:
    Type: String
    Default: http://localhost:5173
  CognitoLogoutUrl:
    Type: String
    Default: http://localhost:5173
  AllowedCorsOrigin:
    Type: String
    Default: http://localhost:5173
  InferenceEndpointUrl:
    Type: String
    Default: ""
    Description: HTTP inference endpoint required for deployed tagging unless ALLOW_DEMO_FALLBACK is explicitly enabled.
  InferenceApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: Legacy optional shared API key sent to the inference endpoint. Prefer InferenceApiKeyParameterName for deployed environments.
  InferenceApiKeyParameterName:
    Type: String
    Default: ""
    AllowedPattern: "^$|^/.+"
    Description: Optional SSM SecureString parameter name containing the inference API key, for example /aussie-ecolens/dev/inference-api-key.

Conditions:
  HasInferenceApiKeyParameter: !Not [!Equals [!Ref InferenceApiKeyParameterName, ""]]

Resources:
  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../services/aws-presignup/src/
      Handler: app.handler
      Timeout: 10
      MemorySize: 128

  PreSignUpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt PreSignUpFunction.Arn
      Principal: cognito-idp.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"

  UserPool:
    Type: AWS::Cognito::UserPool
    DependsOn:
      - PreSignUpInvokePermission
    Properties:
      UserPoolName: !Ref CognitoUserPoolName
      AutoVerifiedAttributes:
        - email
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          Required: true
          Mutable: true
        # Existing Cognito pools cannot switch standard attributes between
        # optional and required after creation; PreSignUpFunction enforces
        # these profile attributes for the deployed pool.
        - Name: given_name
          Required: false
          Mutable: true
        - Name: family_name
          Required: false
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${AppName}-web"
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
      ReadAttributes:
        - email
        - email_verified
        - given_name
        - family_name
      WriteAttributes:
        - email
        - given_name
        - family_name
      CallbackURLs:
        - !Ref CognitoCallbackUrl
      LogoutURLs:
        - !Ref CognitoLogoutUrl
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile

  MediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AppName}-${AWS::AccountId}-${AWS::Region}-media"
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - HEAD
            AllowedOrigins:
              - !Ref AllowedCorsOrigin
            MaxAge: 3000
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  MediaTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: mediaId
          AttributeType: S
        - AttributeName: ownerSub
          AttributeType: S
        - AttributeName: ownerChecksumKey
          AttributeType: S
      KeySchema:
        - AttributeName: mediaId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ownerSub-createdAt-index
          KeySchema:
            - AttributeName: ownerSub
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: ownerChecksumKey-index
          KeySchema:
            - AttributeName: ownerChecksumKey
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  SubscriptionTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: subscriptionId
          AttributeType: S
        - AttributeName: ownerSub
          AttributeType: S
        - AttributeName: email
          AttributeType: S
      KeySchema:
        - AttributeName: subscriptionId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ownerSub-createdAt-index
          KeySchema:
            - AttributeName: ownerSub
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  DedupTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ownerChecksumKey
          AttributeType: S
      KeySchema:
        - AttributeName: ownerChecksumKey
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Aussie EcoLens tag notifications

  HttpApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      Cors:
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: !Sub "'${AllowedCorsOrigin}'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../services/aws-api/src/
      Handler: app.handler
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          MEDIA_BUCKET: !Sub "${AppName}-${AWS::AccountId}-${AWS::Region}-media"
          MEDIA_TABLE: !Ref MediaTable
          SUBSCRIPTION_TABLE: !Ref SubscriptionTable
          DEDUP_TABLE: !Ref DedupTable
          NOTIFICATION_TOPIC_ARN: !Ref NotificationTopic
          CORS_ALLOWED_ORIGIN: !Ref AllowedCorsOrigin
          PRESIGNED_URL_TTL_SECONDS: "900"
          DEDUP_RESERVATION_TTL_SECONDS: "900"
          INFERENCE_ENDPOINT_URL: !Ref InferenceEndpointUrl
          INFERENCE_API_KEY: !Ref InferenceApiKey
          INFERENCE_API_KEY_PARAMETER_NAME: !Ref InferenceApiKeyParameterName
          INFERENCE_TOP_K: "3"
          INFERENCE_TIMEOUT_SECONDS: "90"
          MAX_QUERY_FILE_BYTES: "6291456"
      Policies:
        - Statement:
            Sid: ApiPresignUploads
            Effect: Allow
            Action:
              - s3:PutObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::${AppName}-${AWS::AccountId}-${AWS::Region}-media/uploads/*"
        - Statement:
            Sid: ApiReadAndDeleteMediaObjects
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:DeleteObject
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${AppName}-${AWS::AccountId}-${AWS::Region}-media/uploads/*"
              - !Sub "arn:${AWS::Partition}:s3:::${AppName}-${AWS::AccountId}-${AWS::Region}-media/thumbnails/*"
        - Statement:
            Sid: ApiMediaTableItems
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
            Resource: !GetAtt MediaTable.Arn
        - Statement:
            Sid: ApiMediaTableIndexes
            Effect: Allow
            Action:
              - dynamodb:Query
            Resource:
              - !GetAtt MediaTable.Arn
              - !Sub "${MediaTable.Arn}/index/ownerSub-createdAt-index"
              - !Sub "${MediaTable.Arn}/index/ownerChecksumKey-index"
        - Statement:
            Sid: ApiSubscriptionTableItems
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
            Resource: !GetAtt SubscriptionTable.Arn
        - Statement:
            Sid: ApiSubscriptionTableIndexes
            Effect: Allow
            Action:
              - dynamodb:Query
            Resource:
              - !GetAtt SubscriptionTable.Arn
              - !Sub "${SubscriptionTable.Arn}/index/ownerSub-createdAt-index"
              - !Sub "${SubscriptionTable.Arn}/index/email-index"
        - Statement:
            Sid: ApiDedupTableItems
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DeleteItem
            Resource: !GetAtt DedupTable.Arn
        - !If
          - HasInferenceApiKeyParameter
          - Statement:
              Sid: ApiReadInferenceApiKeyParameter
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${InferenceApiKeyParameterName}"
          - !Ref AWS::NoValue
        - Statement:
            Sid: ApiCreateEmailSubscriptions
            Effect: Allow
            Action:
              - sns:Subscribe
            Resource: !Ref NotificationTopic
            Condition:
              StringEquals:
                "sns:Protocol": email
        - Statement:
            Sid: ApiListTopicSubscriptions
            Effect: Allow
            Action:
              - sns:ListSubscriptionsByTopic
            Resource: !Ref NotificationTopic
        - Statement:
            Sid: ApiPublishManualTagNotifications
            Effect: Allow
            Action:
              - sns:Publish
            Resource: !Ref NotificationTopic
        - Statement:
            Sid: ApiManageSubscriptionAttributes
            Effect: Allow
            Action:
              - sns:Unsubscribe
              - sns:SetSubscriptionAttributes
            # SNS subscription APIs do not expose the topic ARN as a
            # resource-level permission for every subscription operation.
            # Keep this only on the API Lambda; the processor has publish-only SNS.
            Resource: "*"
      Events:
        Root:
          Type: Api
          Properties:
            RestApiId: !Ref HttpApi
            Path: /
            Method: ANY
        Proxy:
          Type: Api
          Properties:
            RestApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  ProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../../services/aws-processor/src/
      Handler: handler.handler
      Timeout: 120
      MemorySize: 512
      Environment:
        Variables:
          MEDIA_BUCKET: !Sub "${AppName}-${AWS::AccountId}-${AWS::Region}-media"
          MEDIA_TABLE: !Ref MediaTable
          DEDUP_TABLE: !Ref DedupTable
          NOTIFICATION_TOPIC_ARN: !Ref NotificationTopic
          INFERENCE_ENDPOINT_URL: !Ref InferenceEndpointUrl
          INFERENCE_API_KEY: !Ref InferenceApiKey
          INFERENCE_API_KEY_PARAMETER_NAME: !Ref InferenceApiKeyParameterName
          INFERENCE_TOP_K: "3"
          INFERENCE_TIMEOUT_SECONDS: "90"
          ALLOW_DEMO_FALLBACK: "false"
          MODEL_VERSION: aws-demo-adapter-v1
          VIDEO_FRAME_RATE: "1"
          VIDEO_MAX_FRAMES: "0"
          VIDEO_EXTRACTION_TIMEOUT_SECONDS: "90"
          VIDEO_PROCESSING_BUDGET_SECONDS: "105"
      Policies:
        - Statement:
            Sid: ProcessorReadMediaObjects
            Effect: Allow
            Action:
              - s3:GetObject
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${AppName}-${AWS::AccountId}-${AWS::Region}-media/uploads/*"
              - !Sub "arn:${AWS::Partition}:s3:::${AppName}-${AWS::AccountId}-${AWS::Region}-media/thumbnails/*"
        - Statement:
            Sid: ProcessorWriteThumbnails
            Effect: Allow
            Action:
              - s3:PutObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::${AppName}-${AWS::AccountId}-${AWS::Region}-media/thumbnails/*"
        - Statement:
            Sid: ProcessorMediaTableItems
            Effect: Allow
            Action:
              - dynamodb:GetItem
              - dynamodb:UpdateItem
            Resource: !GetAtt MediaTable.Arn
        - Statement:
            Sid: ProcessorUpdateDedupStatus
            Effect: Allow
            Action:
              - dynamodb:UpdateItem
            Resource: !GetAtt DedupTable.Arn
        - !If
          - HasInferenceApiKeyParameter
          - Statement:
              Sid: ProcessorReadInferenceApiKeyParameter
              Effect: Allow
              Action:
                - ssm:GetParameter
              Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${InferenceApiKeyParameterName}"
          - !Ref AWS::NoValue
        - Statement:
            Sid: ProcessorPublishTagNotifications
            Effect: Allow
            Action:
              - sns:Publish
            Resource: !Ref NotificationTopic
      Events:
        UploadedObject:
          Type: S3
          Properties:
            Bucket: !Ref MediaBucket
            Events: s3:ObjectCreated:*
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: uploads/

Outputs:
  ApiBaseUrl:
    Description: Protected API base URL.
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
  CognitoUserPoolId:
    Description: Cognito user pool ID for the frontend.
    Value: !Ref UserPool
  CognitoUserPoolClientId:
    Description: Cognito app client ID for the frontend.
    Value: !Ref UserPoolClient
  PreSignUpFunctionName:
    Description: Cognito PreSignUp trigger enforcing email, first name, and last name.
    Value: !Ref PreSignUpFunction
  MediaBucketName:
    Description: Private S3 bucket for uploaded media.
    Value: !Sub "${AppName}-${AWS::AccountId}-${AWS::Region}-media"
  MediaTableName:
    Description: DynamoDB table storing media metadata.
    Value: !Ref MediaTable
  SubscriptionTableName:
    Description: DynamoDB table storing tag subscriptions.
    Value: !Ref SubscriptionTable
  DedupTableName:
    Description: DynamoDB table storing owner-scoped checksum reservations.
    Value: !Ref DedupTable
  NotificationTopicArn:
    Description: SNS topic used by the processor.
    Value: !Ref NotificationTopic
